[package]
name = "vision-cnn"
version = "0.17.0"
edition.workspace = true

[features]
default = [
	"flex",
	"wgpu",
	"cuda",
	"rocm",
	"cpu",
]
flex = [
	"burn/flex",
]
wgpu = [
	"burn/wgpu",
]
cuda = [
	"burn/cuda",
]
rocm = [
	"burn/rocm",
]
cpu = [
	"burn/cpu",
]

[dependencies]
burn = { version = "0.22", default-features = false, features = [
	"std",
	"train",
	"tui",
	"metrics",
	"fusion",
]}
csv = "1.4"
dataset-loader = { path = "../dataset-loader" }
image = { version = "0.25", default-features = false, features = [
	"rayon",
] }
rand = "0.10"
serde = { version = "1", default-features = false, features = [
	"derive",
]}
serde_json = "1"

[dev-dependencies]
burn = { version = "0.22", features = [
	"flex",
	"simd",
]}
burn-flex = { version = "0.22", features = [
	"rayon",
	"simd",
]}

[lints]
workspace = true
